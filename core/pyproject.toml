[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yopo-swarm-core"
version = "0.0.0"
description = "YOPO-Swarm ROS-free 算法核心（G0–G3 CPU 离线部分）"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2"]

[project.optional-dependencies]
upstream = ["torch>=2.1", "ruamel.yaml>=0.17", "scipy>=1.10"]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6", "mpmath>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "upstream: 需要拉取 YOPO-MINCO 上游源码与权重（网络 + torch CPU）",
    "slow: 较大的有界穷举（约 2 分钟），可用 -m 'not slow' 跳过",
]

[tool.ruff]
line-length = 100
target-version = "py310"
