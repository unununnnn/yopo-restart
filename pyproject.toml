[project]
name = "yopo-l0"
version = "0.0.1"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26", "yopo-swarm-core", "torch==2.4.1", "scipy>=1.10", "ruamel.yaml>=0.17"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "mpmath>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yopo_l0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 六机与大 seed 批量", "upstream: 需要钉定的 YOPO 上游源码与权重（首次联网取到 ~/.cache/yopo-swarm）"]
