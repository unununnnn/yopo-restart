[project]
name = "yopo-l0"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yopo_l0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 六机与大 seed 批量"]
